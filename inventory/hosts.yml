---
# kali-forge always provisions the machine it is running on.
# There is no SSH, no remote target, no bastion. You clone the repo inside
# a fresh Kali VM and run it against localhost.
#
# The two VMs (desktop + laptop) are not separate inventory entries because
# they are meant to be identical. Anything that genuinely must differ goes in
# host_vars keyed off the VM's hostname, or better, in a `profile` variable
# passed at runtime:
#
#   ansible-playbook site.yml -e "forge_profile=laptop"

all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
