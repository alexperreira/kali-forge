# kali-forge tmux config — managed by Ansible

set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Ctrl-a is easier to reach than Ctrl-b and doesn't collide with vim
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits that keep the current directory — matters when you're deep in a box dir
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind r source-file ~/.tmux.conf \; display "reloaded"

# Log the whole pane to the current engagement dir. Invaluable when you need
# to reconstruct what you actually ran three hours ago.
bind P pipe-pane -o "cat >>./tmux-#W.log" \; display "logging to ./tmux-#W.log"

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"

set -g status-style bg=colour234,fg=colour250
set -g status-left  "#[bg=colour24,fg=colour255] #S #[default] "
set -g status-right "#[fg=colour244]#(hostname) #[fg=colour250]%H:%M "
set -g status-left-length 30
