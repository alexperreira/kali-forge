---
# Tools from language ecosystems: pipx and go.
#
# These are the ones that silently drift between machines, because you install
# them at 2am mid-box and never write them down. Everything here comes from
# group_vars/all.yml — if it isn't in that file, it doesn't exist on either VM.

# -----------------------------------------------------------------------------
# pipx
# -----------------------------------------------------------------------------
- name: Ensure pipx path is wired up
  ansible.builtin.command: pipx ensurepath
  register: lang_tools_ensurepath
  changed_when: "'has been been added' in lang_tools_ensurepath.stdout or 'added to' in lang_tools_ensurepath.stdout"
  failed_when: false

- name: Install pipx packages
  community.general.pipx:
    name: "{{ item }}"
    state: present
  loop: "{{ pipx_packages }}"
  loop_control:
    label: "{{ item }}"
  register: lang_tools_pipx_result
  failed_when: false
  # failed_when: false is deliberate. A single yanked PyPI package should not
  # abort a 20-minute provision. Failures are reported below.

- name: Report pipx failures
  ansible.builtin.debug:
    msg: >-
      pipx FAILED: {{ lang_tools_pipx_result.results
        | selectattr('failed', 'defined')
        | selectattr('failed')
        | map(attribute='item')
        | list }}
  when: >-
    lang_tools_pipx_result.results
    | selectattr('failed', 'defined')
    | selectattr('failed')
    | list | length > 0

# -----------------------------------------------------------------------------
# Verify pipx actually owns its entry points.
#
# pipx installs the package into a venv, then symlinks each console script into
# ~/.local/bin. If a file with that name already exists and isn't pipx's, pipx
# refuses to overwrite it and reports "symlink missing or pointing to unexpected
# location". The package is installed but you never run it — you run whatever
# already owned the name.
#
# This is silent by default, which is why it's checked explicitly here.
# -----------------------------------------------------------------------------
- name: Check pipx entry point health
  ansible.builtin.command: pipx list
  register: lang_tools_pipx_health
  changed_when: false
  failed_when: false

- name: Repair shadowed pipx entry points
  ansible.builtin.command: pipx reinstall-all
  when: "'symlink missing or pointing to unexpected location' in (lang_tools_pipx_health.stdout | default(''))"
  register: lang_tools_pipx_repair
  changed_when: lang_tools_pipx_repair.rc == 0
  failed_when: false
  # reinstall-all rebuilds each venv and re-attempts the symlinks. It only helps
  # once the colliding apt package is gone — which the apt_tools role handles
  # when impacket_source is 'pipx'. Role order in site.yml matters here:
  # apt_tools runs before lang_tools.

- name: Re-check entry point health after repair
  ansible.builtin.command: pipx list
  register: lang_tools_pipx_recheck
  changed_when: false
  failed_when: false
  when: lang_tools_pipx_repair is changed  # noqa no-handler

- name: Warn if entry points are still shadowed
  ansible.builtin.debug:
    msg:
      - "pipx entry points are STILL shadowed after reinstall-all."
      - "Something outside pipx owns those filenames in ~/.local/bin."
      - "Diagnose with:  which -a psexec.py  &&  ls -la ~/.local/bin/psexec.py"
      - "Then check:     dpkg -S $(readlink -f ~/.local/bin/psexec.py)"
  when: >-
    'symlink missing or pointing to unexpected location'
    in (lang_tools_pipx_recheck.stdout | default(lang_tools_pipx_health.stdout | default('')))

- name: Confirm which impacket actually runs
  ansible.builtin.shell:
    cmd: "set -o pipefail && command -v -a psexec.py 2>/dev/null | head -3 || true"
    executable: /bin/bash
  register: lang_tools_impacket_path
  changed_when: false
  failed_when: false
  when: impacket_source is defined

- name: Work out whether the winning impacket matches the configured source
  ansible.builtin.set_fact:
    lang_tools_impacket_ok: >-
      {{ ('.local' in (lang_tools_impacket_path.stdout | default('')) and impacket_source == 'pipx')
         or ('/usr/bin' in (lang_tools_impacket_path.stdout | default('')) and impacket_source == 'apt') }}
  when: impacket_source is defined

- name: Report the winning impacket
  ansible.builtin.debug:
    msg:
      - "impacket_source: {{ impacket_source }}"
      - "psexec.py resolves to: {{ lang_tools_impacket_path.stdout_lines | default(['(not on PATH)']) }}"
      - >-
        {{ 'consistent with impacket_source'
           if lang_tools_impacket_ok | bool
           else 'MISMATCH — check PATH order in ~/.config/forge/forge.zsh' }}
  when: impacket_source is defined

# -----------------------------------------------------------------------------
# Go
# -----------------------------------------------------------------------------
- name: Ensure GOPATH bin exists
  ansible.builtin.file:
    path: "{{ forge_home }}/go/bin"
    state: directory
    mode: "0755"

# Derive the binary name from the module path:
#   .../nuclei/v3/cmd/nuclei@latest -> nuclei
#   .../hahwul/dalfox/v2@latest     -> dalfox   (naive basename gives "v2")
- name: Check which go tools are already present
  ansible.builtin.stat:
    path: >-
      {{ forge_home }}/go/bin/{{ item
         | regex_replace('@.*$', '')
         | regex_replace('/v[0-9]+$', '')
         | basename }}
  loop: "{{ go_packages }}"
  loop_control:
    label: "{{ item }}"
  register: lang_tools_go_present

- name: Install go tools
  ansible.builtin.command:
    cmd: "go install {{ item.item }}"
  environment:
    GOPATH: "{{ forge_home }}/go"
    GOBIN: "{{ forge_home }}/go/bin"
    GOPROXY: "https://proxy.golang.org,direct"
    GOFLAGS: "-buildvcs=false"
  loop: "{{ lang_tools_go_present.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists
  changed_when: true
  failed_when: false
  # `go install` is not idempotent and is slow (compiles from source), hence
  # the stat check above. To force-refresh a tool, delete its binary from
  # ~/go/bin and re-run. To refresh everything: rm -rf ~/go/bin && re-run.

- name: Install nuclei templates
  ansible.builtin.command:
    cmd: "{{ forge_home }}/go/bin/nuclei -update-templates -silent"
    creates: "{{ forge_home }}/.local/nuclei-templates"
  failed_when: false
